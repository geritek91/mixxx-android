# Compila la APK firmada de Mixxx para Android (solo arm64-v8a).
#
# Secretos necesarios (Settings -> Secrets and variables -> Actions):
#   ANDROID_SIGNING_KEYSTORE_BASE64  keystore PKCS12 en base64 (alias "mixxx")
#   ANDROID_SIGNING_PASSWORD         contrasena del keystore y de la clave
# Si falta alguno, el job falla: nunca se firma con una clave temporal.
#
# Seguridad: ningun paso usa "set -x" ni imprime los secretos. Los secretos
# solo se pasan como variables de entorno a los pasos que los necesitan, el
# keystore se decodifica en $RUNNER_TEMP (fuera del workspace) y se borra al
# terminar, pase lo que pase.

name: android-apk

on:
  workflow_dispatch:
  push:
    branches:
      - apk-cliente

# Un push nuevo cancela la compilacion en curso de la misma rama.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  ANDROID_NDK_VERSION: "27.2.12479018"
  ANDROID_API: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  BUILDENV_BASEPATH: /home/runner/buildenv
  APK_NAME: mixxx-android-stems-arm64.apk

jobs:
  apk:
    name: APK Android arm64-v8a
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      # Copiado de la entrada "Android 15 arm64" de build.yml.
      - name: Liberar disco
        run: |
          df -h /
          sudo apt-get autoremove -y && sudo apt-get clean
          sudo rm -rf /home/packer
          sudo rm -rf /opt/az
          sudo rm -rf /opt/google
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/node
          sudo rm -rf /opt/hostedtoolcache/PyPy
          sudo rm -rf /opt/hostedtoolcache/Python
          sudo rm -rf /opt/microsoft
          sudo rm -rf /opt/pipx
          sudo rm -rf /usr/lib/google-cloud-sdk
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/vcpkg
          df -h /

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historial completo para que "git describe" genere la version.
          fetch-depth: 0
          persist-credentials: false

      - name: JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK 35 y NDK 27.2.12479018
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::No se encuentra el Android SDK del runner (ANDROID_HOME)."
            exit 1
          fi
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::No se encuentra sdkmanager en $SDKMANAGER"
            exit 1
          fi
          PKGS=("platforms;android-${ANDROID_API}" "platform-tools" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}")
          (yes | "$SDKMANAGER" --licenses > /dev/null) || true
          if ! "$SDKMANAGER" --install "${PKGS[@]}" > /dev/null; then
            echo "sdkmanager sin sudo ha fallado; se reintenta con sudo"
            (yes | sudo --preserve-env=JAVA_HOME "$SDKMANAGER" --licenses > /dev/null) || true
            sudo --preserve-env=JAVA_HOME "$SDKMANAGER" --install "${PKGS[@]}" > /dev/null
          fi
          NDK="$SDK/ndk/${ANDROID_NDK_VERSION}"
          if ! grep -q "Pkg.Revision = ${ANDROID_NDK_VERSION}" "$NDK/source.properties"; then
            echo "::error::El NDK ${ANDROID_NDK_VERSION} no esta instalado en $NDK"
            exit 1
          fi
          # El runner trae otro NDK por defecto en ANDROID_NDK_HOME: se fija el 27.2.
          {
            echo "ANDROID_SDK=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_NDK_HOME=$NDK"
            echo "ANDROID_NDK_ROOT=$NDK"
            echo "ANDROID_NDK=$NDK"
          } >> "$GITHUB_ENV"

      - name: Entorno de compilacion (tools/android_buildenv.sh setup)
        run: |
          # Con GITHUB_ENV definido, el script anade sus variables a GITHUB_ENV.
          source tools/android_buildenv.sh setup
          sudo apt-get install -y --no-install-recommends ninja-build
          # Comprobaciones: el script no debe haber cambiado el NDK ni el JDK.
          case "$ANDROID_NDK_HOME" in
            */"${ANDROID_NDK_VERSION}") ;;
            *) echo "::error::ANDROID_NDK_HOME inesperado: $ANDROID_NDK_HOME"; exit 1 ;;
          esac
          "$JAVA_HOME/bin/java" -version 2>&1 | head -n 1 | grep -q '"21' || {
            echo "::error::JAVA_HOME no apunta a un JDK 21: $JAVA_HOME"; exit 1; }
          echo "NDK: $ANDROID_NDK_HOME"
          echo "JDK: $JAVA_HOME"

      - name: Preparar el keystore de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          set +x
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltan los secretos ANDROID_SIGNING_KEYSTORE_BASE64 o ANDROID_SIGNING_PASSWORD. No se firma con una clave temporal."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/mixxx.keystore"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$KEYSTORE"
          # Comprueba keystore, contrasena y alias antes de compilar (la
          # contrasena se lee de una variable de entorno, no de la linea de comandos).
          if ! keytool -list -keystore "$KEYSTORE" -storepass:env KEYSTORE_PASSWORD -alias mixxx > /dev/null; then
            echo "::error::El keystore no se puede abrir con ANDROID_SIGNING_PASSWORD o no contiene el alias 'mixxx'."
            exit 1
          fi
          # Solo datos no secretos van a GITHUB_ENV. Las contrasenas se pasan
          # como env solo a los pasos de configurar y compilar.
          {
            echo "QT_ANDROID_KEYSTORE_PATH=$KEYSTORE"
            echo "QT_ANDROID_KEYSTORE_ALIAS=mixxx"
          } >> "$GITHUB_ENV"

      - name: Configurar
        env:
          QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT6=ON \
            -DQML=ON \
            -DCMAKE_SYSTEM_NAME=Android \
            -DANDROID_ABI=arm64-v8a \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_DEFAULT_HOST_TRIPLET=x64-linux-release \
            -DBUILD_TESTING=OFF \
            -DBUILD_BENCH=OFF \
            -DMIXXX_VCPKG_ROOT="$MIXXX_VCPKG_ROOT" \
            -DCMAKE_TOOLCHAIN_FILE="$MIXXX_VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Version de Qt
        run: |
          QTVER=$(find "$MIXXX_VCPKG_ROOT/installed/arm64-android" -name Qt6CoreConfigVersionImpl.cmake -o -name Qt6CoreConfigVersion.cmake 2>/dev/null \
            | xargs -r grep -ho 'PACKAGE_VERSION "[0-9.]*"' | head -n 1 | grep -o '[0-9.]*' || true)
          echo "Qt: ${QTVER:-desconocida}"
          echo "Qt (archivo de dependencias): ${QTVER:-desconocida}" >> "$GITHUB_STEP_SUMMARY"

      - name: Compilar la APK
        env:
          QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: cmake --build build --target apk --parallel "$(nproc)"

      - name: Verificar firma y metadatos
        run: |
          OUT=build/android-build/build/outputs/apk/release
          ls -la "$OUT"
          mapfile -t APKS < <(find "$OUT" -maxdepth 1 -name '*.apk' ! -name '*unsigned*')
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "::error::Se esperaba exactamente 1 APK firmada en $OUT y hay ${#APKS[@]}."
            exit 1
          fi
          mkdir -p dist
          cp "${APKS[0]}" "dist/$APK_NAME"
          BT="$ANDROID_SDK/build-tools/${ANDROID_BUILD_TOOLS}"
          "$BT/apksigner" verify --verbose --print-certs "dist/$APK_NAME"
          "$BT/aapt2" dump badging "dist/$APK_NAME" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|application-label):"
          (cd dist && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          {
            echo "APK: \`$APK_NAME\` ($(du -h "dist/$APK_NAME" | cut -f1))"
            echo ""
            echo "SHA-256: \`$(cut -d' ' -f1 "dist/$APK_NAME.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir la APK como artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mixxx-android-stems-arm64
          path: |
            dist/${{ env.APK_NAME }}
            dist/${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Borrar el keystore
        if: always()
        run: |
          KEYSTORE="$RUNNER_TEMP/mixxx.keystore"
          if [ -f "$KEYSTORE" ]; then
            shred -u "$KEYSTORE" 2>/dev/null || rm -f "$KEYSTORE"
          fi
          test ! -e "$KEYSTORE"
